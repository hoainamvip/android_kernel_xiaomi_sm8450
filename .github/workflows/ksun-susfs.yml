name: Build PixelOS Kernel - unicorn

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  KERNEL_REPO: hoainamvip/android_kernel_xiaomi_sm8450
  KERNEL_BRANCH: sixteen-qpr2

  # Xiaomi 12S Pro
  DEVICE: unicorn

  # PixelOS SM8450 kernel
  ARCH: arm64

  # Keep the kernel version from the source tree.
  # Only override LOCALVERSION below.
  LOCALVERSION: "-HoaiNam59"

  # SM8450/Android 12 GKI toolchain used by this kernel family.
  CLANG_BRANCH: android12L-d2-s2-release
  CLANG_DIR: clang-r416183b

  # SUSFS for Android 12 / 5.10
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android12-5.10

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ------------------------------------------------------------
      # 1. Free runner disk space
      # ------------------------------------------------------------
      - name: Maximize disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      # ------------------------------------------------------------
      # 2. Dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            zip

      # ------------------------------------------------------------
      # 3. Checkout PixelOS kernel fork
      # ------------------------------------------------------------
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      # ------------------------------------------------------------
      # 4. Show source information
      # ------------------------------------------------------------
      - name: Show kernel source
        run: |
          echo "Repository : $KERNEL_REPO"
          echo "Branch     : $KERNEL_BRANCH"
          echo "Device     : $DEVICE"

          git log -1 --oneline

          echo
          echo "Kernel Makefile:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION|NAME)[[:space:]]*=' Makefile

          echo
          echo "Available SM8450 GKI configs:"
          find arch/arm64/configs/vendor -maxdepth 1 -type f \
            \( -name '*GKI.config' -o -name '*gki*.config' \) \
            -print | sort

      # ------------------------------------------------------------
      # 5. Download the SAME clang generation expected by the tree
      # ------------------------------------------------------------
      - name: Checkout Android Clang
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchains"

          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            -b "$CLANG_BRANCH" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$GITHUB_WORKSPACE/toolchains/clang"

          cd "$GITHUB_WORKSPACE/toolchains/clang"

          git sparse-checkout set \
            "clang-r416183b"

          test -x \
            "clang-r416183b/bin/clang"

          echo "CLANG_PREBUILT=$GITHUB_WORKSPACE/toolchains/clang/$CLANG_DIR/bin" \
            >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 6. Install KernelSU-Next
      # ------------------------------------------------------------
      - name: Install KernelSU-Next
        run: |
          echo "Installing KernelSU-Next..."

          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s next

          test -d KernelSU-Next

          echo
          echo "KernelSU-Next installed:"
          git -C KernelSU-Next log -1 --oneline || true

      # ------------------------------------------------------------
      # 7. Fetch SUSFS
      # ------------------------------------------------------------
      - name: Checkout SUSFS
        run: |
          git clone \
            --depth=1 \
            -b "$SUSFS_BRANCH" \
            "$SUSFS_REPO" \
            "$GITHUB_WORKSPACE/susfs"

          echo
          echo "SUSFS commit:"
          git -C "$GITHUB_WORKSPACE/susfs" log -1 --oneline

          test -f \
            "$GITHUB_WORKSPACE/susfs/kernel_patches/5.10/5.10_susfs.patch"

          test -f \
            "$GITHUB_WORKSPACE/susfs/ksu_patches/ksu_susfs.patch"

      # ------------------------------------------------------------
      # 8. Apply SUSFS to the PixelOS kernel
      #
      # IMPORTANT:
      # We do NOT import EvoX fixes.
      # We do NOT touch mondrian.
      # We do NOT add unrelated audio/camera/vendor patches.
      # ------------------------------------------------------------
      - name: Apply SUSFS
        run: |
          set -e

          echo "Applying SUSFS kernel patch..."

          patch -p1 \
            < "$GITHUB_WORKSPACE/susfs/kernel_patches/5.10/5.10_susfs.patch"

          echo "Installing SUSFS source files..."

          cp \
            "$GITHUB_WORKSPACE/susfs/kernel_patches/fs/susfs.c" \
            fs/susfs.c

          cp \
            "$GITHUB_WORKSPACE/susfs/kernel_patches/include/linux/susfs.h" \
            include/linux/susfs.h

          echo "Patching KernelSU-Next for SUSFS..."

          cd KernelSU-Next

          patch -p1 \
            < "$GITHUB_WORKSPACE/susfs/ksu_patches/ksu_susfs.patch"

      # ------------------------------------------------------------
      # 9. Prepare kernel build environment
      # ------------------------------------------------------------
      - name: Prepare build environment
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          echo "ARCH=$ARCH" >> "$GITHUB_ENV"
          echo "SUBARCH=$SUBARCH" >> "$GITHUB_ENV"

          echo "PATH=$CLANG_PREBUILT:$PATH" >> "$GITHUB_ENV"

          # Force our requested kernel localversion.
          #
          # This does NOT change the kernel's 5.10.252 version.
          # Result should become:
          #
          # 5.10.252-HoaiNam59
          #
          export LOCALVERSION="$LOCALVERSION"
          echo "LOCALVERSION=$LOCALVERSION" >> "$GITHUB_ENV"

          # Disable automatic SCM suffixes.
          scripts/config --file /dev/null 2>/dev/null || true

      # ------------------------------------------------------------
      # 10. Build the PixelOS GKI configuration
      #
      # The source tree remains authoritative.
      # We start from its normal GKI configuration instead of
      # manually constructing a Frankenstein config.
      # ------------------------------------------------------------
      - name: Generate GKI config
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$CLANG_PREBUILT/llvm-"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          mkdir -p out

          make O=out gki_defconfig

          # Apply the device/platform GKI fragments that are part
          # of the SM8450 kernel tree itself.
          #
          # unicorn is the target device.
          for cfg in \
            arch/arm64/configs/vendor/waipio_GKI.config \
            arch/arm64/configs/vendor/xiaomi_GKI.config \
            arch/arm64/configs/vendor/unicorn_GKI.config
          do
            if [ -f "$cfg" ]; then
              echo "Applying $cfg"
              "$GITHUB_WORKSPACE/scripts/kconfig/merge_config.sh" \
                -m \
                out/.config \
                "$cfg"
            fi
          done

          # KSU is provided by KernelSU-Next.
          # SUSFS Kconfig symbols are provided by the SUSFS patch.
          #
          # We only enable the symbols that actually exist in this
          # patched tree. Unknown symbols are NOT blindly injected.
          if grep -q '^config KSU$' \
              KernelSU-Next/kernel/Kconfig 2>/dev/null; then
            echo "CONFIG_KSU=y" >> out/.config
          fi

          # Resolve all dependencies and defaults.
          make O=out olddefconfig

          echo
          echo "KernelSU/SUSFS config:"
          grep -E \
            '^(CONFIG_KSU|CONFIG_KSU_SUSFS)' \
            out/.config || true

      # ------------------------------------------------------------
      # 11. Force localversion after config generation
      # ------------------------------------------------------------
      - name: Set kernel localversion
        run: |
          set -e

          scripts/config --file out/.config \
            --set-str LOCALVERSION "$LOCALVERSION" \
            --disable LOCALVERSION_AUTO

          make O=out olddefconfig

          echo
          echo "Localversion:"
          grep -E \
            '^(CONFIG_LOCALVERSION|CONFIG_LOCALVERSION_AUTO)' \
            out/.config || true

      # ------------------------------------------------------------
      # 12. Build kernel
      # ------------------------------------------------------------
      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$CLANG_PREBUILT:$PATH"

          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE="$CLANG_PREBUILT/llvm-"
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # Keep the PixelOS/SM8450 GKI build characteristics.
          export KCFLAGS="-D__ANDROID_COMMON_KERNEL__"

          make \
            O=out \
            -j"$(nproc)" \
            Image \
            modules \
            dtbs

      # ------------------------------------------------------------
      # 13. Verify output
      # ------------------------------------------------------------
      - name: Verify kernel
        run: |
          set -e

          test -f out/arch/arm64/boot/Image

          echo
          echo "=== Kernel image ==="
          ls -lh out/arch/arm64/boot/Image

          echo
          echo "=== Kernel version ==="
          make -s O=out kernelrelease

          echo
          echo "=== Kernel string ==="
          strings out/arch/arm64/boot/Image \
            | grep -E \
              '5\.10\.252|HoaiNam59' \
            | head -20 || true

          echo
          echo "=== Modules ==="
          find out -type f -name '*.ko' | head -30 || true

      # ------------------------------------------------------------
      # 14. Prepare AnyKernel3
      # ------------------------------------------------------------
      - name: Clone AnyKernel3
        run: |
          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            "$GITHUB_WORKSPACE/AnyKernel3"

      - name: Package AnyKernel3
        run: |
          set -e

          AK3="$GITHUB_WORKSPACE/AnyKernel3"

          rm -rf "$AK3"/Image
          cp out/arch/arm64/boot/Image "$AK3/Image"

          # Add DTBs if the source produces them.
          mkdir -p "$AK3/dtb"

          find out/arch/arm64/boot/dts \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp {} "$AK3/dtb/" \; 2>/dev/null || true

          # Xiaomi 12S Pro / unicorn is an A/B device.
          sed -i \
            's/^device\.name1=.*/device.name1=unicorn/' \
            "$AK3/anykernel.sh"

          sed -i \
            's/^is_slot_device=.*/is_slot_device=1/' \
            "$AK3/anykernel.sh"

          # Give the zip a clear name.
          KERNEL_VERSION="$(make -s O=out kernelrelease)"

          ZIP_NAME="PixelOS-unicorn-${KERNEL_VERSION}-KSU-Next-SUSFS.zip"

          cd "$AK3"

          zip -r9 \
            "$GITHUB_WORKSPACE/$ZIP_NAME" \
            . \
            -x '.git/*' \
            -x 'README.md'

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          echo
          echo "Created:"
          ls -lh "$GITHUB_WORKSPACE/$ZIP_NAME"

      # ------------------------------------------------------------
      # 15. Upload kernel Image + AnyKernel3 ZIP
      # ------------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-unicorn-KSU-Next-SUSFS
          path: |
            PixelOS-unicorn-*-KSU-Next-SUSFS.zip
            out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # 16. Optional GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        if: ${{ inputs.release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: "PixelOS unicorn Kernel ${{ github.run_number }}"
          generate_release_notes: true
          files: |
            PixelOS-unicorn-*-KSU-Next-SUSFS.zip
